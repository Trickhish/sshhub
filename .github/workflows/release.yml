name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate version
        env:
          REF: ${{ github.ref_name }}
        run: |
          [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "VERSION=${REF#v}" >> "$GITHUB_ENV"
      - name: Test
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo mkdir -p /run/sshd
          sudo env PATH="$PATH" go test ./... -race -count=1 -timeout 300s
          go vet ./...
      - name: Build candidates
        run: |
          mkdir -p release
          for ARCH in amd64 arm64; do
            mkdir -p "dist/$ARCH"
            for BIN in sshhub sshhub-agent sshhub-ctl; do
              CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" go build -trimpath -ldflags="-s -w -X github.com/Trickhish/sshhub/internal/version.Version=$VERSION" -o "dist/$ARCH/$BIN" "./cmd/$BIN"
            done
            tar -czf "release/sshhub-linux-$ARCH.tar.gz" -C "dist/$ARCH" sshhub sshhub-ctl
            tar -czf "release/sshhub-agent-linux-$ARCH.tar.gz" -C "dist/$ARCH" sshhub-agent
          done
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-candidates
          path: release/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-release-candidates
          path: release
      - name: Build signing tool before exposing the signing secret
        run: go build -o /tmp/sshhub-sign ./cmd/sshhub-sign
      - name: Sign release
        env:
          SSHHUB_SIGNING_KEY: ${{ secrets.SSHHUB_SIGNING_KEY }}
          REF: ${{ github.ref_name }}
        run: |
          test -n "$SSHHUB_SIGNING_KEY"
          /tmp/sshhub-sign manifest --version "${REF#v}" --dir release
      - name: Verify signed artifacts against installer trust root
        env:
          SSHHUB_EXPECTED_VERSION: ${{ github.ref_name }}
        run: |
          mkdir verified
          for ARCH in amd64 arm64; do
            python3 scripts/verify-release.py release "sshhub-linux-$ARCH.tar.gz" verified sshhub sshhub-ctl
            python3 scripts/verify-release.py release "sshhub-agent-linux-$ARCH.tar.gz" verified sshhub-agent
          done
      - name: Publish breaking release without changing latest
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        run: |
          gh release create "$REF" release/* --verify-tag --latest --title "$REF: forwarding-only SSH" --notes "Breaking migration: OpenSSH backends and explicit jump_users grants are required. Direct SSH sessions and agent self-updates have been removed. Upgrade hub and agents together using independent administrative access. See the README migration instructions."
